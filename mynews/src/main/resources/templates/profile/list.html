<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/profile/list.css}" rel="stylesheet">
</head>
<body>
    <main layout:fragment="contents">
        <div class="wrapper">
            <h1>プロフィール一覧</h1>
            <div class="top-area">
                <button class="btn" th:onclick="|location.href='@{/profile/create}'|">新規作成</button>
            </div>
            <table border="1">
                <tr>
                    <th>No</th>
                    <th>名前</th>
                    <th>性別</th>
                    <th>趣味</th>
                    <th>操作</th>
                </tr>
                <tr th:each="profile, status : ${profileList}">
                    <td th:text="${status.count}"></td>
                    <td th:text="${profile.name}"></td>
                    <td th:text="${profile.gender}"></td>
                    <td th:text="${profile.hobby}"></td>
					<td class="operation-box">
    					<a th:href="@{/profile/edit(id=${profile.id})}" class="operation">編集</a>                     
    					<form method="post" name="delete" th:action="@{/profile/delete}">
        					<input type="hidden" name="id" th:value="${profile.id}">
        					<a href="javascript:void(0)" onclick="this.parentNode.submit()" class="operation">削除</a>
    					</form>
					</td>
                </tr>
            </table>
        </div>
    </main>
</body>
</html>
