<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>プロフィール一覧</title>
    <style>
        /* 簡易的なスタイル */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #fff; padding: 10px; text-align: left; }
        th { background-color: #333; }
    </style>
</head>
<body>
<main layout:fragment="contents">
    <div class="wrapper">
        <h1>プロフィール一覧</h1>
        
        <div style="margin-bottom: 20px;">
            <button class="btn" th:onclick="location.href='/profile/create'">新規登録</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>名前</th>
                    <th>性別</th>
                    <th>趣味</th>
                    <th>自己紹介</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="profile, status : ${profileList}">
                    <td th:text="${status.count}"></td> <td th:text="${profile.name}"></td>
                    <td th:text="${profile.gender}"></td>
                    <td th:text="${profile.hobby}"></td>
                    <td th:text="${profile.introduction}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
