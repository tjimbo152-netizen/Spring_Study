<!DOCTYPE html>
<html th:lang="ja"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/profile/edit.css}">
</head>
<body>
    <main layout:fragment="contents">
        <div class="wrapper">
            <h1>プロフィール編集</h1>
            <form th:action="@{/profile/edit}" th:object="${profileEditForm}" method="post">
                <input type="hidden" th:field="*{id}">
                <ul class="form-ul">
                    <li>
                        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" th:errorclass="error_msg"></p>
                        <div class="form-body">
                            <label for="name" class="title">名前</label>
                            <input type="text" class="input-area" th:field="*{name}" />
                        </div>
                    </li>
                    <li>
					    <p th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" th:errorclass="error_msg"></p>
					    <div class="form-body">
					        <label class="title">性別</label>
					        <div class="radio-group">
					            <label class="radio-item">
					                <input type="radio" th:field="*{gender}" value="男性">
					                <span>男性</span>
					            </label>
					            <label class="radio-item">
					                <input type="radio" th:field="*{gender}" value="女性">
					                <span>女性</span>
					            </label>
					        </div>
					    </div>
					</li>
                    <li>
                        <p th:if="${#fields.hasErrors('hobby')}" th:errors="*{hobby}" th:errorclass="error_msg"></p>
                        <div class="form-body">
                            <label for="hobby" class="title">趣味</label>
                            <input type="text" class="input-area" th:field="*{hobby}" />
                        </div>
                    </li>
                    <li>
                        <p th:if="${#fields.hasErrors('introduction')}" th:errors="*{introduction}" th:errorclass="error_msg"></p>
                        <div class="form-body">
                            <label for="introduction" class="title">自己紹介</label>
                            <textarea rows="10" class="input-area textarea" th:field="*{introduction}"></textarea>
                        </div>
                    </li>
                    <li class="btn-area">
                        <button class="btn">更新</button>
                    </li>
                </ul>
            </form>
            <div class="history-container">
                <p class="history_text">編集履歴</p>
                <ul class="history">
                    <li th:each="history : ${profile.histories}" class="date" 
                        th:text="${#dates.format(history.editedDate, 'yyyy/MM/dd HH:mm:ss')}">
                    </li>
                    <li th:if="${#lists.isEmpty(profile.histories)}">履歴はありません</li>
                </ul>
            </div>
            <div class="return_btn-area">
                <a class="return_btn" th:href="@{/profile/list}">一覧画面に戻る</a>
            </div>
        </div>
    </main>
</body>
</html>
